<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NeuronOps — Administracion de canal digital de la gerencia</title>
<style>
:root {
  --navy: #243A5E; --navy-light: #2e4a75; --navy-dark: #1a2d4a;
  --teal: #2EC4C7; --teal-light: #e0f7f7; --teal-dark: #1fa8ab; --teal-glow: rgba(46,196,199,.10);
  --green: #3ED598; --green-bg: #eafbf3;
  --purple: #5B4B8A;
  --g50: #f8fafc; --g100: #f1f5f9; --g200: #e2e8f0; --g300: #cbd5e1;
  --g400: #94a3b8; --g500: #64748b; --g600: #475569; --g700: #334155; --g800: #1e293b;
  --white: #fff;
  --amber: #f59e0b; --amber-bg: #fffbeb; --amber-border: #fde68a;
  --radius: 16px;
  --shadow: 0 1px 3px rgba(0,0,0,.04), 0 4px 6px rgba(0,0,0,.03);
  --shadow-md: 0 4px 12px rgba(0,0,0,.07);
  --shadow-lg: 0 8px 24px rgba(0,0,0,.09);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f0f4f8;color:var(--g800);line-height:1.65;overflow-x:hidden;-webkit-font-smoothing:antialiased}

/* ── Header ── */
.header{background:var(--navy);padding:0;text-align:center;position:relative;overflow:hidden}
.header-inner{position:relative;z-index:2;padding:32px 20px 28px}
.header::before{content:'';position:absolute;top:-60%;right:-30%;width:500px;height:500px;background:radial-gradient(circle,rgba(46,196,199,.06) 0%,transparent 60%);pointer-events:none}
.header::after{content:'';position:absolute;bottom:-40%;left:-20%;width:400px;height:400px;background:radial-gradient(circle,rgba(94,75,138,.05) 0%,transparent 60%);pointer-events:none}
.header-logo{height:38px;margin-bottom:16px;filter:brightness(0) invert(1);opacity:.95}
.header h1{color:var(--white);font-size:18px;font-weight:700;letter-spacing:-.2px;line-height:1.3}
.header .tagline{color:var(--teal);font-size:12px;margin-top:6px;font-weight:500;letter-spacing:.5px;text-transform:uppercase}

/* ── Progress ── */
.progress-wrap{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--g200);padding:14px 20px;display:flex;align-items:center;gap:14px}
.progress-bar{flex:1;height:5px;background:var(--g200);border-radius:99px;overflow:hidden}
.progress-fill{height:100%;background:linear-gradient(90deg,var(--teal),var(--teal-dark));border-radius:99px;transition:width .5s cubic-bezier(.4,0,.2,1);width:0%}
.progress-label{font-size:11px;font-weight:700;color:var(--navy);min-width:85px;text-align:right;letter-spacing:.3px}

/* ── Container & Steps ── */
.container{max-width:620px;margin:0 auto;padding:24px 16px 120px}
.step{display:none;animation:slideUp .45s cubic-bezier(.4,0,.2,1)}
.step.active{display:block}
@keyframes slideUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ── Cards ── */
.card{background:var(--white);border:1px solid var(--g200);border-radius:var(--radius);padding:28px;margin-bottom:16px;box-shadow:var(--shadow)}
.card-header{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.card-icon{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:19px;flex-shrink:0}
.card-title{font-size:18px;font-weight:700;color:var(--navy);letter-spacing:-.3px}
.card-desc{font-size:13px;color:var(--g400);margin-bottom:24px;padding-left:54px;line-height:1.6}

/* ── Questions ── */
.q{margin-bottom:26px;padding-bottom:22px;border-bottom:1px solid var(--g100)}
.q:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.q-label{font-size:14px;font-weight:600;color:var(--g800);margin-bottom:10px;display:block;line-height:1.5}
.q-hint{font-size:12px;color:var(--g400);margin-top:-6px;margin-bottom:10px;line-height:1.5}
.req{color:var(--teal);margin-left:3px;font-weight:700}

/* ── Options ── */
.opts{display:flex;flex-direction:column;gap:7px}
.opts-row{display:flex;flex-wrap:wrap;gap:7px}
.opt{display:flex;align-items:center;gap:10px;padding:11px 16px;border:1.5px solid var(--g200);border-radius:11px;cursor:pointer;transition:all .18s cubic-bezier(.4,0,.2,1);font-size:13px;color:var(--g600);flex:1;min-width:130px;user-select:none;line-height:1.4}
.opt:hover{border-color:var(--teal);background:var(--teal-glow);color:var(--g800)}
.opt.on{border-color:var(--teal);background:var(--teal-light);color:var(--navy);font-weight:600}
.opt .ck{width:18px;height:18px;border:2px solid var(--g300);border-radius:5px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .18s}
.opt .ck.r{border-radius:50%}
.opt.on .ck{border-color:var(--teal);background:var(--teal)}
.opt.on .ck::after{content:'';width:8px;height:8px;background:var(--white);border-radius:2px;display:block}
.opt.on .ck.r::after{border-radius:50%}

/* ── Inputs ── */
textarea,input[type=text],input[type=number]{width:100%;border:1.5px solid var(--g200);border-radius:11px;padding:12px 16px;font-size:13px;font-family:inherit;color:var(--g800);resize:vertical;transition:all .18s;background:var(--white);line-height:1.6}
textarea:focus,input:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-glow)}
textarea{min-height:72px}
textarea::placeholder,input::placeholder{color:var(--g400)}

/* ── Detail blocks ── */
.detail-block{margin-bottom:20px;padding:20px;background:var(--g50);border-radius:12px;border:1px solid var(--g200)}
.detail-title{font-size:14px;font-weight:700;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.detail-title::before{content:'';width:3px;height:18px;background:var(--teal);border-radius:2px;flex-shrink:0}

/* ── Comment toggle ── */
.cmt-btn{font-size:12px;color:var(--teal-dark);cursor:pointer;margin-top:8px;display:inline-block;border:none;background:none;font-family:inherit;font-weight:500}
.cmt-btn:hover{text-decoration:underline}
.cmt-box{margin-top:8px;display:none}
.cmt-box.vis{display:block}

/* ── Nav buttons ── */
.nav{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px}
.btn{border:none;border-radius:11px;padding:13px 32px;font-size:14px;font-weight:700;cursor:pointer;font-family:inherit;transition:all .18s;letter-spacing:.2px}
.btn:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn:active{transform:translateY(0)}
.btn-teal{background:linear-gradient(135deg,var(--teal),var(--teal-dark));color:var(--white)}
.btn-ghost{background:transparent;color:var(--g500);border:1.5px solid var(--g300);padding:12px 26px}
.btn-ghost:hover{border-color:var(--g400);color:var(--g700);box-shadow:none}
.btn-navy{background:linear-gradient(135deg,var(--navy),var(--navy-light));color:var(--white)}
.btn:disabled{opacity:.4;cursor:not-allowed;transform:none;box-shadow:none}

/* ── Intro ── */
.intro-card{text-align:center;padding:44px 32px}
.intro-card h2{font-size:24px;font-weight:800;color:var(--navy);margin-bottom:6px;letter-spacing:-.4px}
.intro-card .intro-sub{font-size:15px;color:var(--teal-dark);font-weight:600;margin-bottom:16px}
.intro-card p{font-size:14px;color:var(--g500);max-width:440px;margin:0 auto 8px;line-height:1.7}
.intro-features{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:24px 0}
.intro-feat{background:var(--teal-light);color:var(--teal-dark);font-size:12px;font-weight:600;padding:7px 16px;border-radius:99px;letter-spacing:.2px}

/* ── Finish ── */
.finish-card{text-align:center;padding:44px 32px}
.finish-card .done-icon{width:64px;height:64px;border-radius:50%;background:var(--green-bg);display:inline-flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:16px;border:2px solid var(--green)}
.finish-card h2{color:var(--navy);font-size:22px;font-weight:800;margin-bottom:8px}

/* ── Summary ── */
.summary{background:var(--g50);border:1px solid var(--g200);border-radius:12px;padding:20px;text-align:left;font-size:12px;white-space:pre-wrap;font-family:'SF Mono',Monaco,'Fira Code',monospace;max-height:360px;overflow-y:auto;color:var(--g600);margin:20px 0;line-height:1.8}

/* ── Toast ── */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(100px);background:var(--navy);color:var(--white);padding:12px 28px;border-radius:12px;font-size:14px;font-weight:600;transition:transform .3s cubic-bezier(.4,0,.2,1);z-index:100;box-shadow:var(--shadow-lg)}
.toast.show{transform:translateX(-50%) translateY(0)}

/* ── Footer ── */
.footer{text-align:center;padding:20px;font-size:11px;color:var(--g400);letter-spacing:.3px}
.footer a{color:var(--teal-dark);text-decoration:none}

/* ── Responsive ── */
@media(max-width:480px){
  .container{padding:16px 12px 120px}
  .card{padding:22px 18px}
  .opt{min-width:100%}
  .opts-row{flex-direction:column}
  .intro-card{padding:32px 20px}
  .finish-card{padding:32px 20px}
  .nav{flex-direction:column}
  .nav .btn{width:100%}
  .card-desc{padding-left:0;margin-top:4px}
  .header h1{font-size:16px}
}
</style>

// STATE

const A = {}
let cur = 0
function gv(k,t){ return t==='check' ? (A[k]||[]) : (A[k]||'') }

// ════════════════════════════════════════════
// RENDER ENGINE
// ════════════════════════════════════════════
const $app = document.getElementById('app')

function render(){
  const s = STEPS[cur]; $app.innerHTML = ''
  const pw = document.getElementById('progressWrap')
  if(s.type){pw.style.display='none'}
  else{
    pw.style.display='flex'
    const tot=STEPS.filter(x=>!x.type).length, done=STEPS.slice(0,cur).filter(x=>!x.type).length
    document.getElementById('pFill').style.width=Math.round(done/tot*100)+'%'
    document.getElementById('pLabel').textContent=`Seccion ${done+1} de ${tot}`
  }
  if(s.type==='intro') return rIntro()
  if(s.type==='finish') return rFinish()
  if(s.dynamic) return rDynamic(s)
  rStep(s)
}

function rStep(s){
  let h=`<div class="card">
    <div class="card-header">
      <div class="card-icon" style="background:${s.color}12">${s.emoji}</div>
      <div class="card-title">${s.title}</div>
    </div>
    <div class="card-desc">${s.desc}</div>`
  s.questions.forEach(q=>{ if(q.showIf&&!q.showIf())return; h+=rQ(q) })
  h+='</div>'+rNav(); $app.innerHTML=h; bind()
}

function rDynamic(s){
  const sel=gv('tipos_cuales','check')
  if(!sel.length){
    $app.innerHTML=`<div class="card">
      <div class="card-header"><div class="card-icon" style="background:${s.color}12">${s.emoji}</div>
      <div class="card-title">${s.title}</div></div>
      <p style="padding:16px 0 0 54px;font-size:14px;color:var(--g400)">No seleccionaron ningun tipo de comunicacion en el paso anterior. Pueden volver atras para elegir o continuar.</p>
    </div>`+rNav(); return
  }
  let h=`<div class="card">
    <div class="card-header"><div class="card-icon" style="background:${s.color}12">${s.emoji}</div>
    <div class="card-title">${s.title}</div></div>
    <div class="card-desc">${s.desc}</div>`
  sel.forEach(t=>{
    const d=DET[t]; if(!d)return
    h+=`<div class="detail-block"><div class="detail-title">${d.label}</div>`
    d.questions.forEach(q=>{ h+=rQ(q) })
    h+='</div>'
  })
  if(sel.includes('Otro')){
    h+=`<div class="q"><label class="q-label">Contanos sobre los otros tipos de comunicacion</label>
    <textarea data-k="det_otro" placeholder="Que otros tipos manejan, con que frecuencia, a quienes va dirigido...">${esc(A.det_otro||'')}</textarea></div>`
  }
  h+='</div>'+rNav(); $app.innerHTML=h; bind()
}

function rQ(q){
  let h=`<div class="q"><label class="q-label">${q.label}${q.req?'<span class="req">*</span>':''}</label>`
  if(q.hint) h+=`<div class="q-hint">${q.hint}</div>`
  if(q.type==='radio'){
    h+='<div class="opts-row">'
    q.opts.forEach(o=>{
      const on=A[q.k]===o?' on':''
      h+=`<label class="opt${on}" data-k="${q.k}" data-v="${ea(o)}" data-t="radio"><span class="ck r"></span>${o}</label>`
    }); h+='</div>'
  }
  if(q.type==='check'){
    h+='<div class="opts">'; const vs=A[q.k]||[]
    q.opts.forEach(o=>{
      const on=vs.includes(o)?' on':''
      h+=`<label class="opt${on}" data-k="${q.k}" data-v="${ea(o)}" data-t="check"><span class="ck"></span>${o}</label>`
    }); h+='</div>'
  }
  if(q.type==='text') h+=`<textarea data-k="${q.k}" placeholder="${ea(q.placeholder||'')}">${esc(A[q.k]||'')}</textarea>`
  if(q.comment){
    const ck=q.k+'_cmt', hv=A[ck]?' vis':''
    h+=`<button class="cmt-btn" onclick="tCmt(this)">${hv?'- Cerrar comentario':'+ Agregar comentario'}</button>
    <div class="cmt-box${hv}"><textarea data-k="${ck}" placeholder="${ea(q.commentPlaceholder||'Comentario adicional...')}">${esc(A[ck]||'')}</textarea></div>`
  }
  return h+'</div>'
}

function rNav(){
  const first=cur===0, last=cur===STEPS.length-2
  return `<div class="nav">
    ${first?'<div></div>':`<button class="btn btn-ghost" onclick="goBack()">Atras</button>`}
    <button class="btn btn-teal" onclick="goNext()">${last?'Ver resumen':'Siguiente'}</button>
  </div>`
}

// ════════════════════════════════════════════
// EVENTS
// ════════════════════════════════════════════
function bind(){
  document.querySelectorAll('.opt[data-t="radio"]').forEach(el=>{
    el.onclick=()=>{ A[el.dataset.k]=el.dataset.v; render() }
  })
  document.querySelectorAll('.opt[data-t="check"]').forEach(el=>{
    el.onclick=()=>{
      const k=el.dataset.k,v=el.dataset.v
      if(!A[k])A[k]=[]
      const i=A[k].indexOf(v)
      if(i>=0)A[k].splice(i,1); else A[k].push(v)
      render()
    }
  })
  document.querySelectorAll('textarea[data-k],input[data-k]').forEach(el=>{
    el.oninput=()=>{ A[el.dataset.k]=el.value }
  })
}

function tCmt(btn){
  const box=btn.nextElementSibling; box.classList.toggle('vis')
  btn.textContent=box.classList.contains('vis')?'- Cerrar comentario':'+ Agregar comentario'
  if(box.classList.contains('vis')) box.querySelector('textarea').focus()
}

function goNext(){ if(cur<STEPS.length-1){cur++;render();window.scrollTo({top:0,behavior:'smooth'})} }
function goBack(){ if(cur>0){cur--;render();window.scrollTo({top:0,behavior:'smooth'})} }

// ════════════════════════════════════════════
// SUMMARY & SEND
// ════════════════════════════════════════════
function buildSummary(){
  let t=`=== ${PROJECT_NAME.toUpperCase()} ===\nRelevamiento de necesidades\nFecha: ${new Date().toLocaleDateString('es-AR')}\n\n`
  STEPS.forEach(s=>{
    if(s.type)return
    const qs=s.dynamic?getDynQs():(s.questions||[])
    let section=''
    qs.forEach(q=>{
      if(q.showIf&&!q.showIf())return
      const v=q.type==='check'?(A[q.k]||[]).join(', '):(A[q.k]||'')
      if(!v)return
      section+=`  ${q.label}\n    → ${v}\n`
      if(A[q.k+'_cmt']) section+=`    Comentario: ${A[q.k+'_cmt']}\n`
      section+='\n'
    })
    if(section) t+=`--- ${s.title.toUpperCase()} ---\n\n${section}`
  })
  return t+'=== FIN DEL RELEVAMIENTO ===\n'
}

function getDynQs(){
  let qs=[]
  ;(gv('tipos_cuales','check')).forEach(t=>{ const d=DET[t]; if(d)qs=qs.concat(d.questions) })
  if(gv('tipos_cuales','check').includes('Otro')&&A.det_otro) qs.push({k:'det_otro',label:'Otros tipos de comunicacion',type:'text'})
  return qs
}

function sendForm(){
  const btn=document.getElementById('btnSend')
  const status=document.getElementById('sendStatus')
  btn.disabled=true; btn.textContent='Enviando...'
  status.textContent=''

  const summary=buildSummary()

  fetch('https://formsubmit.co/ajax/'+DEST_EMAIL, {
    method:'POST',
    headers:{'Content-Type':'application/json','Accept':'application/json'},
    body:JSON.stringify({
      _subject:'[NeuronOps] Relevamiento — '+PROJECT_NAME,
      _cc:CC_EMAIL,
      _captcha:'false',
      _template:'box',
      _autoresponse:'Gracias por completar el relevamiento. El equipo de NeuronOps lo va a revisar y se van a comunicar con ustedes.',
      message:summary
    })
  })
  .then(r=>r.json())
  .then(data=>{
    if(data.success){
      btn.textContent='Enviado'
      status.innerHTML='<span style="color:var(--green)">Las respuestas se enviaron correctamente. Gracias!</span>'
      toast('Respuestas enviadas correctamente')
    } else {
      throw new Error(data.message||'Error al enviar')
    }
  })
  .catch(e=>{
    btn.disabled=false; btn.textContent='Reintentar envio'
    status.innerHTML='<span style="color:var(--amber)">No se pudo enviar automaticamente. Usa las opciones de abajo para compartir el resumen.</span>'
    console.error('FormSubmit error:',e)
  })
}

function shareWhatsApp(){
  const summary=buildSummary()
  const text=encodeURIComponent(summary)
  // Si hay numero configurado, abre directo; si no, abre selector
  const url=WA_NUMBER ? 'https://wa.me/'+WA_NUMBER+'?text='+text : 'https://wa.me/?text='+text
  window.open(url,'_blank')
}

function copySummary(){
  navigator.clipboard.writeText(buildSummary()).then(()=>toast('Copiado al portapapeles'))
}

function toast(msg){
  const t=document.getElementById('toast')
  t.textContent=msg; t.classList.add('show')
  setTimeout(()=>t.classList.remove('show'),3000)
}

// ════════════════════════════════════════════
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function ea(s){return String(s).replace(/"/g,'&quot;')}

render()
</script>
